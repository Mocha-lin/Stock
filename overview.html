<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 加入強制防快取標籤，解決 iPad 不更新的問題 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 預測總覽牆 - bbb 投資戰情室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #F9F7F2; --text: #374151; --border: #E5E7EB; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; }
        
        .glass-panel { background: white; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; }
        .glass-panel:hover { transform: translateY(-2px); box-shadow: 0 10px 15px rgba(0,0,0,0.05); border-color: #DCD6C9; }
        
        .price-bar-container { position: relative; height: 14px; background: #E5E7EB; border-radius: 7px; margin-top: 12px; width: 100%; overflow: visible; }
        .pb-zone { position: absolute; height: 100%; opacity: 0.35; }
        .pb-buy-zone { background-color: #22C55E; border-radius: 5px; }
        .pb-sell-zone { background-color: #EF4444; border-radius: 5px; }
        .price-marker { position: absolute; top: -6px; width: 4px; height: 26px; background: #1F2937; border-radius: 2px; transform: translateX(-50%); z-index: 20; border: 1px solid white; }
        
        .model-tag-line { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; line-height: 1.2; }
        .model-name-label { font-weight: 800; color: #6B7280; background: #F3F4F6; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-y-auto">

    <!-- Header -->
    <header class="bg-[#ECE8DE] h-16 flex items-center px-6 border-b border-[#DCD6C9] justify-between sticky top-0 z-50 shadow-sm">
        <div class="font-black text-2xl tracking-widest text-[#5A4A42]">bbb OVERVIEW <span class="text-sm font-medium text-gray-500 ml-1">AI 預測總覽</span></div>
        <div class="flex items-center gap-4">
            <a href="index.html" class="bg-gray-700 text-white px-4 py-2 rounded-full text-sm font-bold shadow hover:bg-gray-800 transition flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> 回戰情室
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-6 md:p-8 max-w-[1600px] mx-auto w-full">
        <div id="overview-stats" class="mb-6 text-gray-500 font-bold flex gap-4 text-sm"></div>
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-gray-400">
            <i class="fas fa-box-open text-6xl mb-4 opacity-50"></i>
            <p class="text-xl font-bold">目前資料庫中沒有股票資料</p>
            <p class="text-sm mt-2">請先至戰情室首頁匯入 JSON 資料</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let db = [];
            const container = document.getElementById('cards-container');
            const emptyState = document.getElementById('empty-state');
            const stats = document.getElementById('overview-stats');

            try {
                // 強制抓 GitHub 最新資料 (防止快取)
                const res = await fetch(`./data.json?t=${Date.now()}`);
                if (!res.ok) throw new Error("data.json 讀取失敗");
                
                const cloud = await res.json();
                
                // 🔥 安全檢查：確保資料一定是陣列，否則引發當機
                if (Array.isArray(cloud)) {
                    db = cloud;
                    localStorage.setItem('bbb_db_v5', JSON.stringify(db));
                } else {
                    throw new Error("JSON 結構異常 (不是陣列)");
                }
            } catch (e) {
                console.warn("⚠️ 雲端讀取失敗，改用 localStorage", e);
                const localData = localStorage.getItem('bbb_db_v5');
                if (localData) {
                    try {
                        const parsed = JSON.parse(localData);
                        if (Array.isArray(parsed)) db = parsed;
                    } catch(err) { console.error("解析本地資料失敗", err); }
                }
            }

            if (!db || db.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            stats.innerHTML = `<span class="bg-[#8B7355] text-white px-3 py-1 rounded-full shadow-sm">監控庫存：${db.length} 檔</span>`;

            let cardsHtml = '';

            db.forEach(s => {
                // 🔥 包裝 try-catch，如果單一股票資料壞掉，只會跳過該股，不會讓整面牆白屏
                try {
                    const name = s.name || '--';
                    const id = s.id || '--';
                    const price = s.basicInfo?.price || '-';
                    const changePct = s.basicInfo?.changePercent || '0%';
                    const chgColor = parseFloat(changePct) >= 0 ? "text-[#C0392B]" : "text-[#16A34A]";
                    
                    const updateDate = s.lastUpdated || '-';
                    const status = s.technical_analysis?.status || '等待分析';
                    
                    // 1. 收集預測模型
                    let allPreds = [];
                    if (s.ai_forecasts && Array.isArray(s.ai_forecasts)) allPreds = [...s.ai_forecasts];
                    if (s.technical_analysis?.predictions) {
                        const legacy = s.technical_analysis.predictions;
                        if (!allPreds.some(p => p.model_name === legacy.model_name)) allPreds.push(legacy);
                    }

                    // 2. 好球帶 HTML
                    let strikeZoneHtml = '';
                    if (allPreds.length > 0 && price !== '-' && parseFloat(price) > 0) {
                        const curPrice = parseFloat(price);
                        let maxAbsPct = 5; 
                        let parsedModels = [];

                        allPreds.forEach((p, idx) => {
                            // 🔥 安全轉型：確保字串分割不會出錯 (防呆 p.entry_zone 意外變成數字)
                            const eStr = String(p.entry_zone || '');
                            const xStr = String(p.exit_zone || '');
                            if (!eStr || !xStr || eStr === 'undefined') return;

                            let e = eStr.split('-').map(Number).filter(n => !isNaN(n));
                            let x = xStr.split('-').map(Number).filter(n => !isNaN(n));

                            // 如果只有一個數字(例如 "150")，將其複製變成 ["150", "150"] 避免 NaN 錯誤
                            if(e.length === 1) e.push(e[0]);
                            if(x.length === 1) x.push(x[0]);
                            if(e.length === 0 || x.length === 0) return;

                            const mName = p.model_name || `AI-${idx+1}`;

                            const ePct = e.map(v => ((v - curPrice) / curPrice) * 100);
                            const xPct = x.map(v => ((v - curPrice) / curPrice) * 100);

                            maxAbsPct = Math.max(maxAbsPct, Math.abs(ePct[0]), Math.abs(ePct[1]), Math.abs(xPct[0]), Math.abs(xPct[1]));
                            parsedModels.push({ name: mName, entry: e, exit: x, ePct, xPct });
                        });

                        if (parsedModels.length > 0) {
                            const scaleBound = maxAbsPct * 1.15; 
                            const getPos = (pct) => Math.max(0, Math.min(100, 50 + (pct / scaleBound) * 50));

                            let barZonesHtml = '';
                            let labelsHtml = '';

                            parsedModels.forEach(m => {
                                const leftBuy = getPos(m.ePct[0]);
                                const widthBuy = getPos(m.ePct[1]) - leftBuy;
                                barZonesHtml += `<div class="absolute h-full bg-green-500/40 rounded-sm" style="left: ${leftBuy}%; width: ${widthBuy}%;"></div>`;

                                const leftSell = getPos(m.xPct[0]);
                                const widthSell = getPos(m.xPct[1]) - leftSell;
                                barZonesHtml += `<div class="absolute h-full bg-red-500/40 rounded-sm" style="left: ${leftSell}%; width: ${widthSell}%;"></div>`;

                                const avgEntryPct = (m.ePct[0] + m.ePct[1]) / 2;
                                const avgExitPct = (m.xPct[0] + m.xPct[1]) / 2;

                                labelsHtml += `
                                    <div class="flex justify-between items-center text-[11px] mb-1.5 border-b border-gray-100 pb-1">
                                        <div class="flex items-center gap-1.5">
                                            <span class="font-bold text-gray-500 bg-gray-100 px-1.5 rounded">${m.name}</span>
                                            <span class="text-green-600 font-medium">買: ${m.entry.join('-')} <span class="font-bold text-[10px]">(${avgEntryPct>0?'+':''}${avgEntryPct.toFixed(1)}%)</span></span>
                                        </div>
                                        <div class="text-red-600 font-medium">賣: ${m.exit.join('-')} <span class="font-bold text-[10px]">(${avgExitPct>0?'+':''}${avgExitPct.toFixed(1)}%)</span></div>
                                    </div>
                                `;
                            });

                            strikeZoneHtml = `
                                <div class="mt-4 border-t border-gray-100 pt-3">
                                    <div class="mb-3">${labelsHtml}</div>
                                    <div class="flex justify-between text-[9px] text-gray-400 font-mono px-1 mb-1">
                                        <span>-${Math.round(scaleBound)}%</span>
                                        <span class="font-bold text-gray-600">現價(0%)</span>
                                        <span>+${Math.round(scaleBound)}%</span>
                                    </div>
                                    <div class="relative h-[12px] bg-gray-200 rounded-full w-full overflow-hidden">
                                        ${barZonesHtml}
                                        <div class="absolute top-0 bottom-0 border-l border-dashed border-gray-400 opacity-50" style="left: 50%; z-index: 10;"></div>
                                        <div class="absolute -top-1 w-2.5 h-2.5 rounded-full bg-gray-800 shadow" style="left: calc(50% - 5px); z-index: 20; border: 1.5px solid white;"></div>
                                    </div>
                                </div>
                            `;
                        } else {
                            strikeZoneHtml = `<div class="mt-4 border-t border-gray-100 pt-4 text-center text-gray-300 text-sm font-bold italic">尚無有效區間數據</div>`;
                        }
                    } else {
                        strikeZoneHtml = `<div class="mt-4 border-t border-gray-100 pt-4 text-center text-gray-300 text-sm font-bold italic">尚無 AI 價格預測模型資料</div>`;
                    }

                    // 3. 組裝卡片
                    cardsHtml += `
                        <div class="glass-panel p-5 flex flex-col relative overflow-hidden">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h2 class="text-2xl font-extrabold text-[#2C3E50] tracking-tight">${name} <span class="text-lg font-mono text-gray-400 font-medium ml-1">${id}</span></h2>
                                    <div class="text-[10px] text-gray-400 font-mono mt-1"><i class="fas fa-sync-alt mr-1"></i>${updateDate}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-2xl font-mono font-black ${chgColor}">${price}</div>
                                    <div class="text-xs font-bold ${chgColor}">${changePct}</div>
                                </div>
                            </div>
                            
                            <div class="flex flex-wrap gap-2 mt-1 mb-2">
                                <span class="bg-[#F5F2EB] border border-[#DCD6C9] text-[#8B7355] px-2 py-0.5 rounded text-xs font-bold shadow-sm">
                                    <i class="fas fa-chart-line mr-1"></i>狀態: ${status}
                                </span>
                                ${s.status ? `<span class="bg-purple-100 text-purple-700 border border-purple-200 px-2 py-0.5 rounded text-xs font-bold">${s.status}</span>` : ''}
                            </div>

                            <div class="flex-1 flex flex-col justify-end">
                                ${strikeZoneHtml}
                            </div>
                        </div>
                    `;
                } catch(renderErr) {
                    console.error("渲染股票卡片失敗:", s, renderErr);
                }
            });

            container.innerHTML = cardsHtml;
        });
    </script>
</body>
</html>
