<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情報中心 - bbb 投資戰情室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #FDFBF7; --text: #374151; --border: #E5E7EB; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; }
        
        .glass-panel { background: white; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); border-radius: 12px; }
        .header-title { font-size: 1.25rem; font-weight: 800; color: #4B5563; border-bottom: 2px solid var(--border); padding-bottom: 0.75rem; margin-bottom: 1.25rem; display: flex; align-items: center; }
        
        /* 箭頭樣式 (共用) */
        .arrow-up { display: inline-block; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid #DC2626; margin: 0 6px; vertical-align: middle; }
        .arrow-down { display: inline-block; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 10px solid #16A34A; margin: 0 6px; vertical-align: middle; }
        
        /* 題材標籤 */
        .theme-pill { @apply bg-[#F5F2EB] border border-[#DCD6C9] text-[#8B7355] px-3 py-1 rounded-full text-sm font-bold shadow-sm inline-block; }
        .stock-tag { @apply bg-white border border-gray-200 text-gray-600 px-2 py-1 rounded text-xs font-bold shadow-sm cursor-default hover:bg-gray-50 transition; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-[#ECE8DE] h-16 flex items-center px-6 border-b border-[#DCD6C9] justify-between shrink-0 shadow-sm z-50 sticky top-0">
        <div class="font-black text-2xl tracking-widest text-[#5A4A42]">bbb INTELLIGENCE <span class="text-sm font-medium text-gray-500 ml-1">情報中心</span></div>
        <div class="flex items-center gap-4">
            <a href="index.html" class="bg-gray-700 text-white px-4 py-2 rounded-full text-sm font-bold shadow hover:bg-gray-800 transition flex items-center gap-2">
                <i class="fas fa-home"></i> 回戰情室
            </a>
            <a href="overview.html" class="bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold shadow hover:bg-blue-700 transition flex items-center gap-2">
                <i class="fas fa-th-large"></i> 總覽牆
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <!-- 改為自然往下長，避免擠壓 (移除 h-screen 與 overflow-hidden) -->
    <main class="flex-1 p-4 md:p-8 max-w-[1600px] mx-auto w-full">
        <!-- items-start 讓三個區塊各自分別往下長，不會互相牽制高度 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            
            <!-- Column 1: 熱門題材聚落 -->
            <div class="glass-panel p-6">
                <div class="header-title text-[#8B7355]"><i class="fas fa-tags mr-2"></i>自動提取題材 (Auto-Themes)</div>
                <div class="space-y-4" id="themes_container">
                    <div class="text-gray-400 text-sm italic text-center py-10">資料載入中...</div>
                </div>
            </div>

            <!-- Column 2: 近期事件與大展行事曆 -->
            <div class="glass-panel p-6">
                <div class="header-title text-[#8B7355]"><i class="far fa-calendar-alt mr-2"></i>事件與法說會 (Events)</div>
                <div id="events_container">
                    <div class="text-gray-400 text-sm italic text-center py-10">資料載入中...</div>
                </div>
            </div>

            <!-- Column 3: 最新情報動態 -->
            <div class="glass-panel p-6 bg-[#FFFDF5] border-[#E8E0C0]">
                <div class="header-title text-[#8B7355] border-[#DCD6C9]"><i class="fas fa-bolt mr-2 text-yellow-500"></i>最新情報動態 (News Feed)</div>
                <div class="space-y-4" id="news_container">
                    <div class="text-gray-400 text-sm italic text-center py-10">資料載入中...</div>
                </div>
            </div>

        </div>
    </main>

    <script>
        window.onload = () => {
            const localData = localStorage.getItem('bbb_db_v5');
            const db = localData ? JSON.parse(localData) : [];
            
            if (db.length === 0) {
                document.getElementById('themes_container').innerHTML = '<div class="text-center text-gray-400 py-10 text-lg">無資料，請先至戰情室匯入股票</div>';
                document.getElementById('events_container').innerHTML = '<div class="text-center text-gray-400 py-10 text-lg">無資料</div>';
                document.getElementById('news_container').innerHTML = '<div class="text-center text-gray-400 py-10 text-lg">無資料</div>';
                return;
            }

            let themeMap = {};
            let allEvents = [];
            let allNews = [];

            // 忽略一些太過廣泛、無意義的新聞標籤
            const ignoreTags = ['新聞', '情報', '消息', '財報', '行情', '公告', '動態'];

            db.forEach(s => {
                // --- 1. 自動提取題材邏輯 (Auto-Themes Extraction) ---
                let autoThemes = new Set();
                
                // (a) 提取手動輸入的標籤
                if (s.themes && Array.isArray(s.themes)) {
                    s.themes.forEach(t => autoThemes.add(t));
                }
                
                // (b) 提取 AI 產業分析中的「產業分類 (Sector)」
                if (s.industry_analysis?.sector) {
                    autoThemes.add(s.industry_analysis.sector);
                }

                // (c) 提取 AI 新聞分析中的「標籤 (Tag)」
                const newsList = (s.ai_message_board && s.ai_message_board.left_messages) || (s.news_events && s.news_events.news) || [];
                newsList.forEach(n => {
                    let t = n.tag;
                    if (t && !ignoreTags.includes(t)) {
                        autoThemes.add(t); // 只有不是無意義標籤才加入
                    }
                });

                // 將收集到的這檔股票的所有題材，歸類到總表
                autoThemes.forEach(t => {
                    if (!themeMap[t]) themeMap[t] = [];
                    // 避免同一檔股票在同個題材下出現兩次
                    if (!themeMap[t].some(x => x.id === s.id)) {
                        themeMap[t].push({ id: s.id, name: s.name });
                    }
                });

                // --- 2. 收集事件 Events ---
                const events = (s.ai_message_board && s.ai_message_board.right_events) || (s.news_events && s.news_events.calendar) || [];
                events.forEach(e => {
                    if (e.date && e.event) {
                        allEvents.push({ date: e.date, event: e.event, stockName: s.name });
                    }
                });

                // --- 3. 收集情報 News ---
                newsList.forEach(n => {
                    let text = n.content || n.title;
                    let tag = n.tag || (n.type ? (n.type.includes('news') ? '新聞' : '情報') : '情報');
                    let sentiment = n.sentiment; 
                    if(sentiment === undefined && n.type) {
                        sentiment = n.type.includes('pos') ? 1 : (n.type.includes('neg') ? -1 : 0);
                    }
                    if (text && n.date) {
                        allNews.push({ date: n.date, content: text, tag: tag, sentiment: sentiment, stockName: s.name });
                    }
                });
            });

            // 渲染：題材 (依照包含的股票數量降序排列)
            const sortedThemes = Object.entries(themeMap).sort((a, b) => b[1].length - a[1].length);
            let themesHtml = '';
            if (sortedThemes.length === 0) {
                themesHtml = '<div class="text-gray-400 text-base italic text-center py-8">目前尚無分析資料可提取題材</div>';
            } else {
                sortedThemes.forEach(([theme, stocks]) => {
                    const stocksHtml = stocks.map(st => `<span class="stock-tag">${st.name}</span>`).join(' ');
                    themesHtml += `
                        <div class="border border-gray-200 rounded-lg p-4 bg-gray-50 shadow-sm hover:shadow transition">
                            <div class="flex justify-between items-center mb-3">
                                <span class="theme-pill">${theme}</span>
                                <span class="text-sm font-bold text-gray-500 bg-gray-200 px-3 py-1 rounded-full">${stocks.length} 檔</span>
                            </div>
                            <div class="flex flex-wrap gap-2 pl-1">
                                ${stocksHtml}
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('themes_container').innerHTML = themesHtml;

            // 渲染：事件 (依照日期降序排列)
            allEvents.sort((a, b) => new Date(b.date) - new Date(a.date));
            let eventsHtml = '';
            if (allEvents.length === 0) {
                eventsHtml = '<div class="text-gray-400 text-base italic text-center py-8">近期無重大事件</div>';
            } else {
                let lastDate = '';
                allEvents.slice(0, 50).forEach(e => {
                    if (e.date !== lastDate) {
                        eventsHtml += `<div class="font-mono text-[#8B7355] text-sm font-black mt-6 mb-3 border-b-2 border-[#E5E0D8] pb-1"><i class="fas fa-flag mr-2"></i>${e.date}</div>`;
                        lastDate = e.date;
                    }
                    eventsHtml += `
                        <div class="flex items-start gap-3 mb-4 pl-2 bg-white p-3 rounded-lg border border-gray-100 shadow-sm">
                            <div class="bg-gray-700 text-white text-xs font-bold px-2 py-1 rounded whitespace-nowrap mt-0.5 shadow-sm">${e.stockName}</div>
                            <div class="text-base text-gray-800 font-medium leading-relaxed">${e.event}</div>
                        </div>
                    `;
                });
            }
            document.getElementById('events_container').innerHTML = eventsHtml;

            // 渲染：情報 (依照日期降序排列)
            allNews.sort((a, b) => new Date(b.date) - new Date(a.date));
            let newsHtml = '';
            if (allNews.length === 0) {
                newsHtml = '<div class="text-gray-400 text-base italic text-center py-8">近期無情報更新</div>';
            } else {
                allNews.slice(0, 60).forEach(m => {
                    let arrow = '';
                    if (m.sentiment === 'positive' || m.sentiment === 1) arrow = '<span class="arrow-up"></span>';
                    else if (m.sentiment === 'negative' || m.sentiment === -1) arrow = '<span class="arrow-down"></span>';
                    else arrow = '<span class="inline-block w-[24px]"></span>'; 
                    
                    let tagHtml = m.tag ? `<span class="bg-[#ECE8DE] text-[#8B7355] px-2 py-0.5 rounded text-xs font-bold mr-2 align-top border border-[#DCD6C9]">${m.tag}</span>` : '';

                    newsHtml += `
                        <div class="py-4 border-b border-gray-200 flex gap-3 items-start bg-white p-4 rounded-xl shadow-sm mb-3">
                            <div class="flex flex-col items-center shrink-0 w-16 gap-1.5 pt-1">
                                <span class="font-mono text-gray-500 text-xs">${m.date.substring(5)}</span>
                                <span class="text-xs font-black text-gray-700 bg-gray-100 px-2 py-1 rounded">${m.stockName}</span>
                            </div>
                            <div class="pt-1 shrink-0">${arrow}</div>
                            <div class="text-gray-800 text-base leading-relaxed flex-1 font-medium">
                                ${tagHtml}${m.content}
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('news_container').innerHTML = newsHtml;
        };
    </script>
</body>
</html>
