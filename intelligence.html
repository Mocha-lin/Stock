<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情報中心 - bbb 投資戰情室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #FDFBF7; --text: #374151; --border: #E5E7EB; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; }
        
        .glass-panel { background: white; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); border-radius: 12px; }
        .header-title { font-size: 1.25rem; font-weight: 800; color: #4B5563; border-bottom: 2px solid var(--border); padding-bottom: 0.75rem; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between;}
        
        .arrow-up { display: inline-block; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid #DC2626; margin: 0 6px; vertical-align: middle; }
        .arrow-down { display: inline-block; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 10px solid #10B981; margin: 0 6px; vertical-align: middle; }
        
        .score-badge { font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
        .score-high { background: #FEE2E2; color: #B91C1C; }
        .score-mid { background: #FEF3C7; color: #B45309; }
        .score-low { background: #E0F2FE; color: #0369A1; }

        /* 新增：NEW 標籤動畫 */
        .badge-new { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        /* 新增：已讀狀態樣式 */
        .is-read { opacity: 0.6; filter: grayscale(50%); transition: all 0.3s; }
        .is-read:hover { opacity: 1; filter: grayscale(0%); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-[#ECE8DE] h-16 flex items-center px-6 border-b border-[#DCD6C9] justify-between shrink-0 shadow-sm z-50 sticky top-0">
        <div class="font-black text-2xl tracking-widest text-[#5A4A42]">bbb INTELLIGENCE <span class="text-sm font-medium text-gray-500 ml-1">情報中心</span></div>
        <div class="flex items-center gap-3">
            <!-- 新增：標記已讀按鈕 -->
            <button onclick="markAllAsRead()" class="bg-white border border-gray-300 text-gray-600 px-3 py-1.5 rounded-full text-sm font-bold shadow-sm hover:bg-gray-50 transition flex items-center gap-2">
                <i class="fas fa-check-double"></i> 標為已讀
            </button>
            <a href="index.html" class="bg-gray-700 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow hover:bg-gray-800 transition flex items-center gap-2">
                <i class="fas fa-home"></i> 回戰情室
            </a>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-8 max-w-[1600px] mx-auto w-full">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            
            <!-- Column 1: AI 國際情報雷達 -->
            <div class="glass-panel p-6 bg-blue-50/30 border-blue-100">
                <div class="header-title text-blue-800 border-blue-200">
                    <span><i class="fas fa-satellite-dish mr-2"></i>AI 國際情報雷達</span>
                    <div id="radar-time" class="text-xs text-gray-500 font-normal">讀取中...</div>
                </div>
                <div class="space-y-3" id="external_news_container">
                    <div class="text-gray-400 text-sm italic text-center py-10"><i class="fas fa-spinner fa-spin mr-2"></i>載入 AI 雷達數據中...</div>
                </div>
            </div>

            <!-- Column 2: 庫存股事件與大展行事曆 -->
            <div class="glass-panel p-6">
                <div class="header-title text-[#8B7355]"><span><i class="far fa-calendar-alt mr-2"></i>自選股行事曆 (Events)</span></div>
                <div id="events_container">
                    <div class="text-gray-400 text-sm italic text-center py-10">資料載入中...</div>
                </div>
            </div>

            <!-- Column 3: 庫存股情報動態 -->
            <div class="glass-panel p-6 bg-[#FFFDF5] border-[#E8E0C0]">
                <div class="header-title text-[#8B7355] border-[#DCD6C9]"><span><i class="fas fa-bolt mr-2 text-yellow-500"></i>自選股情報動態 (News Feed)</span></div>
                <div class="space-y-4" id="news_container">
                    <div class="text-gray-400 text-sm italic text-center py-10">資料載入中...</div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // 初始化：取得上次造訪時間與已讀列表
        let lastVisitTime = parseInt(localStorage.getItem('bbb_last_visit') || '0');
        let readItems = JSON.parse(localStorage.getItem('bbb_read_items') || '[]');
        const currentTime = new Date().getTime();

        window.onload = () => {
            loadInternalData();
            fetchAiRadarNews();
            
            // 網頁載入完成後，更新最後造訪時間 (延遲 3 秒讓使用者能看到 NEW 標籤)
            setTimeout(() => {
                localStorage.setItem('bbb_last_visit', currentTime.toString());
            }, 3000);
        };

        // 新增：標記點擊過的新聞為已讀
        function markAsRead(id, elementId) {
            if (!readItems.includes(id)) {
                readItems.push(id);
                // 限制儲存數量避免 localStorage 爆掉
                if(readItems.length > 200) readItems.shift(); 
                localStorage.setItem('bbb_read_items', JSON.stringify(readItems));
            }
            document.getElementById(elementId).classList.add('is-read');
            const badge = document.getElementById('badge-' + elementId);
            if(badge) badge.style.display = 'none';
        }

        // 新增：全部標記為已讀按鈕功能
        function markAllAsRead() {
            localStorage.setItem('bbb_last_visit', new Date().getTime().toString());
            location.reload(); // 重新載入畫面套用已讀狀態
        }

        // --- 1. 抓取 AI 雷達 JSON ---
        async function fetchAiRadarNews() {
            const container = document.getElementById('external_news_container');
            const timeTag = document.getElementById('radar-time');
            
            try {
                const response = await fetch('./bbb_news_payload.json');
                if (!response.ok) throw new Error('找不到資料');
                const data = await response.json();
                
                const dateObj = new Date(data.generated_at);
                timeTag.innerText = `更新於: ${dateObj.getHours()}:${String(dateObj.getMinutes()).padStart(2,'0')}`;

                let html = '';
                data.items.slice(0, 15).forEach((item, index) => {
                    let scoreClass = 'score-low';
                    if (item.importance >= 70) scoreClass = 'score-high';
                    else if (item.importance >= 50) scoreClass = 'score-mid';

                    let impactIcon = '';
                    if (item.impact === 'positive') impactIcon = '<i class="fas fa-arrow-up text-green-600 ml-1"></i>';
                    else if (item.impact === 'negative') impactIcon = '<i class="fas fa-arrow-down text-red-600 ml-1"></i>';

                    // 判斷是否為新資料或已讀
                    const itemTime = new Date(item.generated_at || data.generated_at).getTime();
                    const isNew = itemTime > lastVisitTime;
                    const isRead = readItems.includes(item.url);
                    const readClass = isRead ? 'is-read' : '';
                    const newBadge = (isNew && !isRead) ? `<span id="badge-radar-${index}" class="badge-new bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded ml-2 font-black tracking-wider">NEW</span>` : '';

                    html += `
                        <div id="radar-${index}" class="border-b border-blue-100 bg-white p-3 rounded-lg shadow-sm hover:shadow transition mb-3 ${readClass}" onclick="markAsRead('${item.url}', 'radar-${index}')">
                            <div class="flex justify-between items-center mb-1">
                                <div>
                                    <span class="bg-blue-50 text-blue-700 text-[11px] font-bold px-2 py-0.5 rounded">${item.theme}</span>
                                    ${newBadge}
                                </div>
                                <span class="score-badge ${scoreClass}">AI評分:${item.importance}</span>
                            </div>
                            <a href="${item.url}" target="_blank" class="text-gray-800 text-sm font-bold hover:text-blue-600 block mb-1">
                                ${item.title}
                            </a>
                            <div class="text-xs text-gray-500 bg-gray-50 p-2 rounded border border-gray-100">
                                <strong>AI判讀:</strong> ${item.reason} ${impactIcon}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = `<div class="text-gray-400 text-sm italic text-center py-6">系統正等待自動更新...</div>`;
            }
        }

        // --- 2. 處理內部自選股資料 ---
        function loadInternalData() {
            const localData = localStorage.getItem('bbb_db_v5');
            const db = localData ? JSON.parse(localData) :[];
            
            if (db.length === 0) {
                document.getElementById('events_container').innerHTML = '<div class="text-center text-gray-400 py-10">無資料</div>';
                document.getElementById('news_container').innerHTML = '<div class="text-center text-gray-400 py-10">無資料</div>';
                return;
            }

            let allEvents = [];
            let allNews =[];

            db.forEach(s => {
                const events = (s.ai_message_board && s.ai_message_board.right_events) || (s.news_events && s.news_events.calendar) ||[];
                events.forEach(e => {
                    if (e.date && e.event) allEvents.push({ date: e.date, event: e.event, stockName: s.name });
                });

                const newsList = (s.ai_message_board && s.ai_message_board.left_messages) || (s.news_events && s.news_events.news) ||[];
                newsList.forEach(n => {
                    let text = n.content || n.title;
                    let tag = n.tag || (n.type ? (n.type.includes('news') ? '新聞' : '情報') : '情報');
                    let sentiment = n.sentiment; 
                    if(sentiment === undefined && n.type) sentiment = n.type.includes('pos') ? 1 : (n.type.includes('neg') ? -1 : 0);
                    if (text && n.date) allNews.push({ date: n.date, content: text, tag: tag, sentiment: sentiment, stockName: s.name });
                });
            });

            // 渲染：事件
            allEvents.sort((a, b) => new Date(b.date) - new Date(a.date));
            let eventsHtml = '';
            if (allEvents.length === 0) eventsHtml = '<div class="text-gray-400 text-base italic text-center py-8">無重大事件</div>';
            else {
                let lastDate = '';
                allEvents.slice(0, 30).forEach(e => {
                    if (e.date !== lastDate) {
                        eventsHtml += `<div class="font-mono text-[#8B7355] text-sm font-black mt-6 mb-3 border-b-2 border-[#E5E0D8] pb-1"><i class="fas fa-flag mr-2"></i>${e.date}</div>`;
                        lastDate = e.date;
                    }
                    eventsHtml += `
                        <div class="flex items-start gap-3 mb-4 pl-2 bg-white p-3 rounded-lg border border-gray-100 shadow-sm hover:shadow-md transition">
                            <div class="bg-gray-700 text-white text-xs font-bold px-2 py-1 rounded whitespace-nowrap mt-0.5 shadow-sm">${e.stockName}</div>
                            <div class="text-base text-gray-800 font-medium leading-relaxed">${e.event}</div>
                        </div>
                    `;
                });
            }
            document.getElementById('events_container').innerHTML = eventsHtml;

            // 渲染：情報
            allNews.sort((a, b) => new Date(b.date) - new Date(a.date));
            let newsHtml = '';
            if (allNews.length === 0) newsHtml = '<div class="text-gray-400 text-base italic text-center py-8">無情報更新</div>';
            else {
                // 取得今日日期字串用來判斷 NEW
                const todayStr = new Date().toISOString().split('T')[0];

                allNews.slice(0, 40).forEach((m, index) => {
                    let arrow = '';
                    if (m.sentiment === 'positive' || m.sentiment === 1) arrow = '<span class="arrow-up"></span>';
                    else if (m.sentiment === 'negative' || m.sentiment === -1) arrow = '<span class="arrow-down"></span>';
                    else arrow = '<span class="inline-block w-[24px]"></span>'; 
                    
                    let tagHtml = m.tag ? `<span class="bg-[#ECE8DE] text-[#8B7355] px-2 py-0.5 rounded text-xs font-bold mr-2 align-top border border-[#DCD6C9]">${m.tag}</span>` : '';

                    // 判斷是否為新情報 (由於內部資料只有日期，我們把"今天"的當作NEW)
                    const uniqueId = m.stockName + m.date + index; // 產生唯一ID
                    const isRead = readItems.includes(uniqueId);
                    const isNew = m.date === todayStr;
                    const readClass = isRead ? 'is-read' : '';
                    const newBadge = (isNew && !isRead) ? `<span id="badge-news-${index}" class="badge-new bg-red-500 text-white text-[9px] px-1 py-0.5 rounded block mt-1 text-center font-black">NEW</span>` : '';

                    newsHtml += `
                        <div id="news-${index}" class="py-4 border-b border-gray-200 flex gap-3 items-start bg-white p-4 rounded-xl shadow-sm mb-3 cursor-pointer ${readClass}" onclick="markAsRead('${uniqueId}', 'news-${index}')">
                            <div class="flex flex-col items-center shrink-0 w-16 gap-1.5 pt-1">
                                <span class="font-mono text-gray-500 text-xs">${m.date.substring(5)}</span>
                                <span class="text-xs font-black text-gray-700 bg-gray-100 px-2 py-1 rounded w-full text-center">${m.stockName}</span>
                                ${newBadge}
                            </div>
                            <div class="pt-1 shrink-0">${arrow}</div>
                            <div class="text-gray-800 text-sm leading-relaxed flex-1 font-medium">
                                ${tagHtml}${m.content}
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('news_container').innerHTML = newsHtml;
        }
    </script>
</body>
</html>
