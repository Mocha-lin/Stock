name: Daily Stock Pipeline Update

on:
  schedule:
    - cron: '0 7 * * *' # 15:00 Taipei Time (07:00 UTC)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Stock IDs from summary
        id: extract_stocks
        run: |
          STOCKS=$(python -c "import json; print(' '.join([item['id'] for item in json.load(open('stocks_summary.json', encoding='utf-8'))]))")
          echo "STOCKS=$STOCKS" >> $GITHUB_ENV

      - name: Run Stock Pipeline
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python stock_pipeline_local.py --stocks ${{ env.STOCKS }}

      - name: Update JSON from TXT
        run: |
          python update_json_from_txt.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stocks_summary.json details/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stock prices [$(date +'%Y-%m-%d %H:%M:%S')]" && git push)
