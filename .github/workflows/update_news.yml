name: 自動更新 AI 股市情報雷達

on:
  schedule:
    # 1. 台灣時間 08:00 到 14:00 (台股重點時段：每小時整點執行)
    - cron: '0 0-6 * * *'
    
    # 2. 台灣時間 20:00 到 24:00 (美股重點時段：每小時整點執行)
    - cron: '0 12-16 * * *'
    
    # 3. 台灣時間 04:00 與 06:00 (美股收盤與早晨總報)
    - cron: '0 20,22 * * *'
    
  workflow_dispatch: # 允許手動點擊執行
jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下載你的網站原始碼
        uses: actions/checkout@v4

      - name: 安裝 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: pip install requests

      - name: 執行 Python 抓取新聞
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python bbb_news_radar.py

      - name: 將最新資料儲存並更新到你的網站
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add bbb_news_payload.json bbb_news_digest.md
          git commit -m "Auto-update: AI News Radar" || echo "No changes to commit"
          git push
