name: 自動更新 AI 股市情報雷達

on:
  schedule:
    # 1. 台股盤中：台灣時間 09:00 到 13:30，每半小時一次
    # (UTC 時間 01:00 到 05:30)
    - cron: '0,30 1-5 * * *'
    
    # 2. 美股盤中：台灣時間 21:00 到 03:00，每兩小時一次
    # (UTC 時間 13:00, 15:00, 17:00, 19:00)
    - cron: '0 13,15,17,19 * * *'
    
    # 3. 盤前與盤後：台灣時間 07:00 (早晨) 與 17:00 (傍晚)
    # (UTC 時間 23:00 與 09:00)
    - cron: '0 9,23 * * *'
    
  workflow_dispatch: # 允許手動點擊執行

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下載你的網站原始碼
        uses: actions/checkout@v4

      - name: 安裝 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: pip install requests deep-translator

      - name: 執行 Python 抓取新聞
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python bbb_news_radar.py

      - name: 將最新資料儲存並更新到你的網站
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add bbb_news_payload.json bbb_news_digest.md
          git commit -m "Auto-update: AI News Radar" || echo "No changes to commit"
          git push
