name: 自動分片處理 data.json

on:
  push:
    paths:
      - 'data.json'
  workflow_dispatch:

jobs:
  partition:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run partition script
        run: python partition_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add stocks_summary.json details/
          git commit -m "Auto-partition data.json" || echo "No changes to commit"
          git push
